name: Backup settimanale Supabase

on:
  schedule:
    - cron: '0 3 * * 0' # domenica alle 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Il runner ha pg_dump 16, ma il server Supabase è 17: pg_dump rifiuta versioni diverse.
      # Installiamo il client 17 e lo mettiamo prima nel PATH.
      - name: Installa client PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Verifica versione pg_dump
        run: pg_dump --version
      - name: Dump del database
        env:
          # Stringa di connessione "Session pooler" da Supabase → Project Settings → Database
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --schema=public --format=custom --file=ohana-$(date +%F).dump
      - name: Carica su Cloudflare R2 (S3 compatibile)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }} # https://<account>.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp ohana-*.dump "s3://$R2_BUCKET/backups/" --endpoint-url "$R2_ENDPOINT"
      # In alternativa a R2: carica il dump come artifact (conservato 30 giorni)
      - uses: actions/upload-artifact@v4
        with:
          name: ohana-backup
          path: ohana-*.dump
          retention-days: 30
